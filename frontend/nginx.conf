server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # 自動補斜線的轉址只給路徑，不寫 http://（外面是 Cloudflare 的 https）
    absolute_redirect off;

    # Allow larger uploads
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\\.";

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Disable the obsolete XSS auditor. CSP is the supported control.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS 一年；不含子網域，子網域各自決定。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Content-Security-Policy
    # 允許從 bb-made.com 載入 API，並開放 Google Fonts / Cloudflare Web Analytics（GA4 已停用）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://bb-made.com; connect-src 'self' https://bb-made.com https://cloudflareinsights.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # Proxy storage requests back to backend storage
    location ^~ /storage/ {
        proxy_pass http://portfolio-backend/storage/;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 打包的檔名帶 hash，內容一變檔名就變，可以放心快取一年
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # 中英文履歷 PDF 都不給搜尋引擎收錄（BB 不想本名被搜尋到；公開版 PDF 也已拿掉本名）
    location ~ ^/resume(-en)?\.pdf$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # 沒帶 hash 的靜態檔（圖示、頭像、封面、履歷 PDF）只快取一天，換檔不用手動清 Cloudflare
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|pdf|webmanifest|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        # add_header directives in a child location replace inherited headers.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # Reject common automated probes instead of serving the SPA with HTTP 200.
    location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|adminer)(?:/|$) {
        return 404;
        access_log off;
        log_not_found off;
    }

    # sitemap 由後端依已發布作品動態產生，不再維護靜態檔
    location = /sitemap.xml {
        proxy_pass http://portfolio-backend/api/v1/sitemap;
        proxy_set_header Host $host;
    }

    # API proxy → Laravel backend
    # ⚠️ backend 容器內部 port 是 80 (Apache)，不是 8000
    location /api/ {
        proxy_pass http://portfolio-backend/api/;
        # The public proxy owns these headers. Hide identical upstream copies
        # to avoid browsers receiving conflicting duplicate policies.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MoodCanvas - path-based routing under /mood/
    location ^~ /mood/ {
        rewrite ^/mood/?(.*)$ /$1 break;
        proxy_pass http://moodcanvas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 作品頁：後端把這件作品的標題、描述、封面填進 index.html，分享到 LINE／FB 才有自己的預覽卡片；
    # 不存在的作品回 404。後端掛了就退回一般的 index.html，畫面照常由 Vue 顯示。
    location ~ ^/projects/\d+/?$ {
        rewrite ^/projects/(\d+)/?$ /api/v1/share/projects/$1 break;
        proxy_pass http://portfolio-backend;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # Handle SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
